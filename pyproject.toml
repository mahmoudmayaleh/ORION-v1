[project]
name = "orion"
version = "0.1.0"
description = "Slice Orchestrator Assistant for Multi-Domain 6G Network Slicing"
requires-python = ">=3.11"
dependencies = [
    # Core model of the substrate and the simulation.
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Learning stack.
    "torch>=2.2",
    "gymnasium>=0.29",
    # LLM planner. The client is OpenAI-compatible and is pointed at either the
    # local llama.cpp server or a frontier endpoint; there is no vendor SDK here.
    "openai>=1.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy", "pre-commit"]
retrieval = ["faiss-cpu>=1.8.0", "rank-bm25>=0.2.2", "sentence-transformers>=3.0.0"]
actors = ["torch-geometric>=2.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/orion"
