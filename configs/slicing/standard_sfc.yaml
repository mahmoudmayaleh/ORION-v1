# VNF type catalog and SFC templates for 3GPP-inspired 6G slice types.
# permitted_tiers encodes constraint C8: D_f = {n in N : tier(n) in permitted_tiers(vnf_type)}

vnf_types:
  Firewall:   { permitted_tiers: [ran_edge, mec, regional_cloud, central_cloud] }
  DPI:        { permitted_tiers: [mec, regional_cloud, central_cloud] }
  Cache:      { permitted_tiers: [mec, regional_cloud, central_cloud] }
  CDN:        { permitted_tiers: [regional_cloud, central_cloud] }
  vEPC:       { permitted_tiers: [mec, regional_cloud] }
  EdgeApp:    { permitted_tiers: [ran_edge, mec] }
  Aggregator: { permitted_tiers: [mec, regional_cloud, central_cloud] }
  Filter:     { permitted_tiers: [ran_edge, mec, regional_cloud, central_cloud] }
  Analytics:  { permitted_tiers: [regional_cloud, central_cloud] }
  MECApp:     { permitted_tiers: [mec] }
  Predictor:  { permitted_tiers: [mec, regional_cloud] }
  Transcoder: { permitted_tiers: [mec, regional_cloud, central_cloud] }
  Renderer:   { permitted_tiers: [mec, regional_cloud] }

slice_templates:
  eMBB:
    chain: [Firewall, DPI, Cache, CDN]
    chain_length_range: [3, 4]
    delay_budget_ms: [50, 100]
    min_throughput_mbps: [100, 500]
    min_reliability: [0.99, 0.999]

  URLLC:
    chain: [Firewall, vEPC, EdgeApp]
    chain_length_range: [2, 3]
    delay_budget_ms: [5, 20]
    min_throughput_mbps: [10, 50]
    min_reliability: [0.9999, 0.99999]

  mMTC:
    chain: [Aggregator, Filter, Analytics]
    chain_length_range: [3, 4]
    delay_budget_ms: [100, 500]
    min_throughput_mbps: [1, 10]
    min_reliability: [0.95, 0.99]

  V2X:
    chain: [Firewall, vEPC, MECApp, Predictor]
    chain_length_range: [3, 4]
    delay_budget_ms: [10, 30]
    min_throughput_mbps: [50, 200]
    min_reliability: [0.9999, 0.99999]

  XR:
    chain: [Firewall, Transcoder, Renderer, CDN, EdgeApp]
    chain_length_range: [4, 5]
    delay_budget_ms: [20, 50]
    min_throughput_mbps: [200, 1000]
    min_reliability: [0.999, 0.9999]
